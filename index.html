<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Selfie Coach</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: rgba(18, 21, 26, 0.72);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #eef1f4;
    --text-dim: #9aa3ad;
    --accent: #4fd1c5;
    --amber: #f6ad55;
    --red: #fc8181;
    --err: #fc8181;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #video, #overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  #overlay { pointer-events: none; }

  #statusbar {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 15px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    z-index: 10;
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex-shrink: 0; transition: background 0.3s; }
  #dot.tracking { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  #dot.error { background: var(--err); }

  /* Hint chip */
  #hint {
    position: fixed;
    bottom: calc(max(16px, env(safe-area-inset-bottom)) + 150px);
    left: 50%;
    transform: translateX(-50%) translateY(0);
    padding: 12px 22px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.35s, transform 0.35s;
  }
  #hint.show { opacity: 1; }
  #hint.perfect {
    background: rgba(79, 209, 197, 0.16);
    border-color: rgba(79, 209, 197, 0.45);
    color: var(--accent);
  }

  /* Score ring */
  #ringwrap {
    position: fixed;
    bottom: max(18px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 118px;
    z-index: 10;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.45));
  }
  #ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #ringbg { fill: rgba(13,16,20,0.55); stroke: rgba(255,255,255,0.12); stroke-width: 7; }
  #ringfg { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transition: stroke 0.4s; }
  #scoreNum {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  #scoreNum .n { font-size: 34px; font-weight: 700; line-height: 1; }
  #scoreNum .cap { font-size: 9px; font-weight: 600; letter-spacing: 0.12em; color: var(--text-dim); text-transform: uppercase; margin-top: 3px; }
  #ringwrap.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }

  /* Debug panel */
  #devbtn {
    position: fixed;
    bottom: max(18px, env(safe-area-inset-bottom));
    right: 14px;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 50%;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--text-dim);
    font-size: 16px;
    z-index: 11;
    cursor: pointer;
    user-select: none;
  }
  #debug {
    position: fixed;
    top: calc(max(14px, env(safe-area-inset-top)) + 52px);
    left: 12px;
    display: none;
    flex-direction: column;
    gap: 5px;
    z-index: 10;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
  }
  #debug.show { display: flex; }
  #debug .row {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 4px 9px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #debug .row b { color: var(--text-dim); font-weight: 600; margin-right: 6px; }

  /* Center message */
  #message {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 32px;
    background: rgba(11, 13, 16, 0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 20;
    transition: opacity 0.4s;
  }
  #message.hidden { opacity: 0; pointer-events: none; }
  #message h1 { font-size: 21px; font-weight: 650; }
  #message p { font-size: 14.5px; color: var(--text-dim); max-width: 420px; line-height: 1.55; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(255,255,255,0.12);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #tag {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: 14px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 6px 11px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 10;
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="tag">Selfie Coach · Step 2</div>
<div id="statusbar"><span id="dot"></span><span id="statustext">Starting…</span></div>

<div id="hint"></div>

<div id="ringwrap">
  <svg viewBox="0 0 118 118">
    <circle id="ringbg" cx="59" cy="59" r="52"/>
    <circle id="ringfg" cx="59" cy="59" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
  </svg>
  <div id="scoreNum"><span class="n" id="scoreVal">0</span><span class="cap">score</span></div>
</div>

<div id="devbtn" title="debug">⚙</div>
<div id="debug">
  <div class="row"><b>pose</b><span id="d-pose">–</span></div>
  <div class="row"><b>frame</b><span id="d-frame">–</span></div>
  <div class="row"><b>light</b><span id="d-light">–</span></div>
  <div class="row"><b>expr</b><span id="d-expr">–</span></div>
  <div class="row"><b>score</b><span id="d-score">–</span></div>
  <div class="row"><b>fps</b><span id="d-fps">–</span></div>
</div>

<div id="message">
  <div class="spinner" id="spinner"></div>
  <h1 id="msg-title">Loading the face engine…</h1>
  <p id="msg-body">Downloading the on-device AI model (~3 MB). Your camera feed never leaves this device.</p>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = (id) => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
const dot = $("dot"), statustext = $("statustext");
const message = $("message"), msgTitle = $("msg-title"), msgBody = $("msg-body"), spinner = $("spinner");
const hintEl = $("hint"), ringfg = $("ringfg"), ringwrap = $("ringwrap"), scoreVal = $("scoreVal");
const RING_C = 326.7;

const lum = document.createElement("canvas");
lum.width = 64; lum.height = 64;
const lumCtx = lum.getContext("2d", { willReadFrequently: true });
const lumBg = document.createElement("canvas");
lumBg.width = 48; lumBg.height = 27;
const lumBgCtx = lumBg.getContext("2d", { willReadFrequently: true });

let landmarker = null, drawer = null;
let lastVideoTime = -1;
let frames = 0, fpsWindowStart = performance.now(), fps = 0;

// ---------- helpers ----------
function showError(title, body) {
  spinner.style.display = "none";
  message.classList.remove("hidden");
  msgTitle.textContent = title;
  msgBody.textContent = body;
  dot.className = "error";
  statustext.textContent = "Stopped";
}
function setStatus(tracking) {
  dot.className = tracking ? "tracking" : "";
  statustext.textContent = tracking ? "Tracking" : "Looking for you…";
}
class EMA {
  constructor(alpha, v = null) { this.a = alpha; this.v = v; }
  push(x) { this.v = this.v === null ? x : this.v + this.a * (x - this.v); return this.v; }
}
// 1 inside [lo,hi], falling to 0 at (lo-slack)/(hi+slack)
function bandScore(v, lo, hi, slack) {
  if (v >= lo && v <= hi) return 1;
  const d = v < lo ? lo - v : v - hi;
  return Math.max(0, 1 - d / slack);
}
// 1 when |v|<=good, 0 at |v|>=bad
function toleranceScore(v, good, bad) {
  const a = Math.abs(v);
  if (a <= good) return 1;
  return Math.max(0, 1 - (a - good) / (bad - good));
}
function poseFromMatrix(m) {
  const r02 = m[8], r22 = m[10], r12 = m[9], r10 = m[1], r11 = m[5];
  const d = 180 / Math.PI;
  return {
    yaw: Math.atan2(r02, r22) * d,
    pitch: -Math.asin(Math.max(-1, Math.min(1, r12))) * d,
    roll: Math.atan2(r10, r11) * d,
  };
}
function blend(shapes, name) {
  const c = shapes.find((s) => s.categoryName === name);
  return c ? c.score : 0;
}
function avgLuma(c, cctx) {
  const data = cctx.getImageData(0, 0, c.width, c.height).data;
  let t = 0;
  for (let i = 0; i < data.length; i += 4) t += 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
  return t / (data.length / 4) / 255;
}

// ---------- smoothed signals ----------
const sYaw = new EMA(0.25), sPitch = new EMA(0.25), sRoll = new EMA(0.25);
const sSmile = new EMA(0.3), sEyes = new EMA(0.3);
const sFaceLight = new EMA(0.15), sBgLight = new EMA(0.15);
const sCx = new EMA(0.25), sEyesY = new EMA(0.25), sSize = new EMA(0.25);
const sScore = new EMA(0.18, 0);
let lightCounter = 0;

// ---------- session-relative score ----------
let sessionBest = 55;

// ---------- hint engine ----------
let currentHint = "";
let candidateHint = "";
let candidateSince = 0;
let perfectSince = 0;
const HOLD_MS = 700;

function pickHint(sig) {
  // priority: framing size > centering > roll > yaw > pitch > light > eyes > smile
  if (sig.size < 0.16) return "Bring the phone a little closer";
  if (sig.size > 0.52) return "Move the phone back a bit";
  if (Math.abs(sig.cx) > 0.16) return "Center your face in the frame";
  if (sig.eyesY < 0.24) return "Lower the phone a little";
  if (sig.eyesY > 0.55) return "Raise the phone a little";
  if (Math.abs(sig.roll) > 9) return "Level your head";
  if (Math.abs(sig.yaw) > 16) return "Face the camera straight on";
  if (sig.pitch > 14) return "Lower your chin a touch";
  if (sig.pitch < -16) return "Lift your chin a little";
  if (sig.faceLight < 0.28) return "Find more light on your face";
  if (sig.bgLight - sig.faceLight > 0.22) return "Turn toward the light";
  if (sig.faceLight > 0.85) return "A bit too bright — angle away from the light";
  if (sig.eyes < 0.62) return "Open your eyes";
  if (sig.smile < 0.22) return "Now smile!";
  return "";
}
function updateHint(text, now, isPerfect) {
  if (isPerfect) {
    hintEl.textContent = "Perfect — hold it!";
    hintEl.className = "show perfect";
    return;
  }
  if (text !== candidateHint) { candidateHint = text; candidateSince = now; }
  if (candidateHint !== currentHint && now - candidateSince >= HOLD_MS) currentHint = candidateHint;
  if (currentHint) { hintEl.textContent = currentHint; hintEl.className = "show"; }
  else hintEl.className = "";
}

// ---------- model + camera ----------
async function loadModel() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  landmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numFaces: 1,
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: true,
  });
  drawer = new DrawingUtils(ctx);
}
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw Object.assign(new Error("insecure"), { name: "InsecureContext" });
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
  });
  video.srcObject = stream;
  await new Promise((res) => {
    if (video.readyState >= 2) return res();
    video.onloadeddata = () => res();
  });
  await video.play();
  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;
}

// ---------- main loop ----------
function loop() {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const now = performance.now();

  const result = landmarker.detectForVideo(video, now);
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  const hasFace = result.faceLandmarks && result.faceLandmarks.length > 0;
  setStatus(hasFace);

  if (!hasFace) {
    updateHint("Come into the frame", now, false);
    drawScore(sScore.push(0), false);
    return;
  }

  const lms = result.faceLandmarks[0];
  drawer.drawConnectors(lms, FaceLandmarker.FACE_LANDMARKS_FACE_OVAL, { color: "rgba(79,209,197,0.4)", lineWidth: 2 });

  // --- geometry ---
  let minX = 1, minY = 1, maxX = 0, maxY = 0;
  for (const p of lms) {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  const size = sSize.push(maxX - minX);                    // face width / frame width
  const cx = sCx.push((minX + maxX) / 2 - 0.5);            // horizontal offset from center
  const eyeMidY = (lms[33].y + lms[263].y) / 2;
  const eyesY = sEyesY.push(eyeMidY);                      // eye line, 0=top of frame

  // --- pose ---
  let yaw = 0, pitch = 0, roll = 0;
  if (result.facialTransformationMatrixes && result.facialTransformationMatrixes.length > 0) {
    const p = poseFromMatrix(result.facialTransformationMatrixes[0].data);
    yaw = sYaw.push(p.yaw); pitch = sPitch.push(p.pitch); roll = sRoll.push(p.roll);
  }

  // --- expression ---
  let smile = 0, eyes = 1;
  if (result.faceBlendshapes && result.faceBlendshapes.length > 0) {
    const sh = result.faceBlendshapes[0].categories;
    smile = sSmile.push((blend(sh, "mouthSmileLeft") + blend(sh, "mouthSmileRight")) / 2);
    eyes = sEyes.push(1 - (blend(sh, "eyeBlinkLeft") + blend(sh, "eyeBlinkRight")) / 2);
  }

  // --- lighting (every 5th frame) ---
  if (lightCounter++ % 5 === 0) {
    const vw = video.videoWidth, vh = video.videoHeight;
    lumCtx.drawImage(video, minX * vw, minY * vh, Math.max(8, (maxX - minX) * vw), Math.max(8, (maxY - minY) * vh), 0, 0, 64, 64);
    sFaceLight.push(avgLuma(lum, lumCtx));
    lumBgCtx.drawImage(video, 0, 0, 48, 27);
    const whole = avgLuma(lumBg, lumBgCtx);
    const areaRatio = Math.min(0.8, (maxX - minX) * (maxY - minY));
    sBgLight.push(Math.max(0, Math.min(1, (whole - sFaceLight.v * areaRatio) / (1 - areaRatio))));
  }
  const faceLight = sFaceLight.v ?? 0.5, bgLight = sBgLight.v ?? 0.5;

  // --- component scores ---
  const angleScore = Math.min(
    toleranceScore(yaw, 10, 32),
    toleranceScore(pitch, 12, 32),
    toleranceScore(roll, 6, 22)
  );
  const framingScore = Math.min(
    bandScore(size, 0.20, 0.44, 0.18),
    toleranceScore(cx, 0.08, 0.28),
    bandScore(eyesY, 0.30, 0.48, 0.22)
  );
  const backlight = Math.max(0, bgLight - faceLight - 0.12);
  const lightScore = Math.max(0, bandScore(faceLight, 0.40, 0.72, 0.30) - backlight * 1.5);
  const eyesScore = Math.max(0, Math.min(1, (eyes - 0.5) / 0.35));
  const smileCurve = Math.max(0, Math.min(1, smile / 0.45));
  const expr = eyesScore * (0.35 + 0.65 * smileCurve);

  const poseGate = angleScore * framingScore * lightScore;
  const raw = 100 * poseGate * (0.55 + 0.45 * expr);

  // --- session-relative mapping ---
  sessionBest = Math.max(sessionBest * 0.9997, raw, 55);
  const displayed = sScore.push(Math.min(100, (raw / sessionBest) * 100));

  // --- perfect detection ---
  const sig = { size, cx, eyesY, yaw, pitch, roll, faceLight, bgLight, eyes, smile };
  const hintText = pickHint(sig);
  const isPerfectNow = displayed >= 93 && hintText === "";
  if (isPerfectNow) { if (!perfectSince) perfectSince = now; } else perfectSince = 0;
  const isPerfect = perfectSince && now - perfectSince >= 500;

  updateHint(hintText, now, isPerfect);
  drawScore(displayed, isPerfect);

  // --- debug ---
  if (debugOn) {
    $("d-pose").textContent = `y${yaw.toFixed(0)} p${pitch.toFixed(0)} r${roll.toFixed(0)} → ${(angleScore * 100).toFixed(0)}`;
    $("d-frame").textContent = `sz${(size * 100).toFixed(0)} cx${(cx * 100).toFixed(0)} ey${(eyesY * 100).toFixed(0)} → ${(framingScore * 100).toFixed(0)}`;
    $("d-light").textContent = `f${(faceLight * 100).toFixed(0)} b${(bgLight * 100).toFixed(0)} → ${(lightScore * 100).toFixed(0)}`;
    $("d-expr").textContent = `sm${(smile * 100).toFixed(0)} ey${(eyes * 100).toFixed(0)} → ${(expr * 100).toFixed(0)}`;
    $("d-score").textContent = `raw${raw.toFixed(0)} best${sessionBest.toFixed(0)} → ${displayed.toFixed(0)}`;
  }
  frames++;
  if (now - fpsWindowStart >= 1000) {
    fps = Math.round((frames * 1000) / (now - fpsWindowStart));
    frames = 0; fpsWindowStart = now;
    if (debugOn) $("d-fps").textContent = String(fps);
  }
}

function drawScore(displayed, isPerfect) {
  const v = Math.max(0, Math.min(100, displayed));
  ringfg.style.strokeDashoffset = String(RING_C * (1 - v / 100));
  ringfg.style.stroke = v >= 80 ? "var(--accent)" : v >= 50 ? "var(--amber)" : "var(--red)";
  scoreVal.textContent = String(Math.round(v));
  ringwrap.classList.toggle("pulse", !!isPerfect);
}

// ---------- debug toggle ----------
let debugOn = false;
$("devbtn").addEventListener("click", () => {
  debugOn = !debugOn;
  $("debug").classList.toggle("show", debugOn);
});

// ---------- boot ----------
async function main() {
  try {
    statustext.textContent = "Loading model…";
    await loadModel();
  } catch (e) {
    console.error(e);
    showError("Couldn't load the face engine", "Check your internet connection and reload — the AI model downloads once from a CDN, then runs fully on your device.");
    return;
  }
  try {
    msgTitle.textContent = "One more thing — the camera";
    msgBody.textContent = "Your browser will ask for camera permission. The video is processed on your device only; nothing is uploaded.";
    await startCamera();
  } catch (e) {
    console.error(e);
    if (e.name === "NotAllowedError" || e.name === "SecurityError") {
      showError("Camera permission needed", "Please allow camera access for this page (click the camera icon in the address bar), then reload.");
    } else if (e.name === "NotFoundError") {
      showError("No camera found", "This device doesn't seem to have a camera the browser can use.");
    } else if (e.name === "InsecureContext") {
      showError("This page needs a secure context", "Open this page over https or localhost — browsers only allow camera access in secure contexts.");
    } else {
      showError("Camera error", (e && e.message) ? e.message : "Something went wrong starting the camera. Try reloading.");
    }
    return;
  }
  message.classList.add("hidden");
  requestAnimationFrame(loop);
}
main();
</script>
</body>
</html>
